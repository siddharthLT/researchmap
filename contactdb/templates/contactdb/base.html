<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ContactDB{% endblock %}</title>
  <style>
    :root {
      --bg: #f7f3ec;
      --ink: #172026;
      --muted: #64717a;
      --panel: #ffffff;
      --line: #d8dedf;
      --blue: #2563eb;
      --green: #138a72;
      --orange: #c05621;
      --shadow: 0 18px 45px rgba(23, 32, 38, .14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 32px;
      border-bottom: 1px solid var(--line);
      background: #fcfaf6;
    }
    .topbar h1 {
      margin: 0;
      font-size: 1.3rem;
    }
    .topbar nav a {
      color: var(--muted);
      font-weight: 600;
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .topbar nav a.map-link { margin-left: 18px; }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 32px 60px;
    }
    .breadcrumb {
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .breadcrumb a { color: var(--muted); font-weight: 600; }
    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  <div class="topbar">
    <h1>ContactDB</h1>
    <nav>
      <a href="{% url 'contactdb:home' %}">Lists</a>
      <a class="map-link" href="{% url 'companymap:map' %}">Company Map</a>
    </nav>
  </div>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
